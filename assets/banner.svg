<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#ec4899;#3b82f6;#6366f1" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#06b6d4;#8b5cf6;#a855f7" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#6366f1;#ec4899;#06b6d4" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: url(#accentGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .toggle-switch-1 {
        animation: toggleAnim1 4s ease-in-out infinite;
      }
      .toggle-switch-2 {
        animation: toggleAnim2 5s ease-in-out infinite;
      }
      .toggle-switch-3 {
        animation: toggleAnim3 4.5s ease-in-out infinite;
      }
      .pulse-circle {
        animation: pulseAnim 3s ease-in-out infinite;
      }
      .floating-particle {
        animation: floatAnim 6s ease-in-out infinite;
      }

      @keyframes toggleAnim1 {
        0%, 100% { transform: translateX(0px); fill: #10b981; }
        50% { transform: translateX(34px); fill: #6366f1; }
      }
      @keyframes toggleAnim2 {
        0%, 100% { transform: translateX(34px); fill: #ec4899; }
        50% { transform: translateX(0px); fill: #10b981; }
      }
      @keyframes toggleAnim3 {
        0%, 100% { transform: translateX(0px); fill: #06b6d4; }
        50% { transform: translateX(34px); fill: #f59e0b; }
      }
      @keyframes pulseAnim {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes floatAnim {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="220" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="180" r="140" fill="#ec4899" opacity="0.08" filter="url(#glow)" />

  <!-- Card Border -->
  <rect x="1.5" y="1.5" width="1197" height="357" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Floating Tech Elements Left & Center -->
  <g class="floating-particle" style="transform-origin: center;">
    <circle cx="90" cy="70" r="4" fill="#6366f1" opacity="0.7" />
    <circle cx="1110" cy="80" r="3" fill="#06b6d4" opacity="0.8" />
    <circle cx="1080" cy="300" r="4" fill="#ec4899" opacity="0.6" />
    <circle cx="120" cy="290" r="3.5" fill="#10b981" opacity="0.7" />
  </g>

  <!-- Top Category Chip -->
  <g transform="translate(80, 52)">
    <rect width="270" height="32" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="21" class="badge-text" fill="#a5b4fc">FEATURE TOGGLES &amp; OPS</text>
  </g>

  <!-- Main Banner Title -->
  <g transform="translate(80, 135)">
    <text x="0" y="0" class="title-text">Awesome Feature Flag Management</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80, 175)">
    <text x="0" y="0" class="subtitle-text">Curated SaaS Platforms, Enterprise Solutions &amp; Open-Source Ecosystem</text>
  </g>

  <!-- Feature Pills / Badges in Banner -->
  <g transform="translate(80, 215)">
    <!-- Pill 1: Progressive Delivery -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="14" y="22" class="badge-text">🚀 Progressive Delivery</text>
    </g>
    <!-- Pill 2: A/B Experimentation -->
    <g transform="translate(195, 0)">
      <rect width="185" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="14" y="22" class="badge-text">🎯 A/B Experimentation</text>
    </g>
    <!-- Pill 3: OpenFeature Standard -->
    <g transform="translate(395, 0)">
      <rect width="180" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="14" y="22" class="badge-text">🌐 OpenFeature (CNCF)</text>
    </g>
    <!-- Pill 4: Safe Software Release -->
    <g transform="translate(590, 0)">
      <rect width="175" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="14" y="22" class="badge-text">⚡ Dark Releases</text>
    </g>
  </g>

  <!-- Interactive/Dynamic Feature Toggle Switch Visual on the Right -->
  <g transform="translate(870, 75)">
    <!-- Panel Box -->
    <rect width="250" height="210" rx="14" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#softGlow)" />

    <!-- Panel Header -->
    <text x="20" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">LIVE TOGGLE MATRIX</text>
    <line x1="20" y1="46" x2="230" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Toggle Row 1 -->
    <g transform="translate(20, 62)">
      <text x="0" y="16" font-family="monospace" font-size="12" fill="#cbd5e1">canary_v2_rollout</text>
      <!-- Switch Track -->
      <rect x="150" y="2" width="60" height="24" rx="12" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="1" />
      <!-- Switch Knob (Animated) -->
      <circle cx="162" cy="14" r="9" class="toggle-switch-1" filter="url(#softGlow)" />
    </g>

    <!-- Toggle Row 2 -->
    <g transform="translate(20, 110)">
      <text x="0" y="16" font-family="monospace" font-size="12" fill="#cbd5e1">dark_launch_ai</text>
      <!-- Switch Track -->
      <rect x="150" y="2" width="60" height="24" rx="12" fill="rgba(236, 72, 153, 0.25)" stroke="#ec4899" stroke-width="1" />
      <!-- Switch Knob (Animated) -->
      <circle cx="162" cy="14" r="9" class="toggle-switch-2" filter="url(#softGlow)" />
    </g>

    <!-- Toggle Row 3 -->
    <g transform="translate(20, 158)">
      <text x="0" y="16" font-family="monospace" font-size="12" fill="#cbd5e1">experiment_engine</text>
      <!-- Switch Track -->
      <rect x="150" y="2" width="60" height="24" rx="12" fill="rgba(6, 182, 212, 0.25)" stroke="#06b6d4" stroke-width="1" />
      <!-- Switch Knob (Animated) -->
      <circle cx="162" cy="14" r="9" class="toggle-switch-3" filter="url(#softGlow)" />
    </g>
  </g>

  <!-- Bottom Terminal/Status Line -->
  <g transform="translate(80, 305)">
    <circle cx="6" cy="6" r="4" fill="#10b981" />
    <text x="20" y="10" font-family="monospace" font-size="12" fill="#64748b">STATUS: 100% OPERATIONAL • REAL-TIME CONFIG SYNC • TRUNK-BASED READY</text>
  </g>
</svg>
